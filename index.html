<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vera — Apps</title>
<style>
  :root{--zemin:#F6F2E9;--metin:#16201B;--ikincil:#3E4842;--soluk:#7C8880;--cizgi:#E2DCCE;--vurgu:#A85D42}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --zemin:#0B0F0D;--metin:#F2EFE6;--ikincil:#C9C4B5;--soluk:#6E7A72;--cizgi:#242C28;--vurgu:#C7846F}}
  body{margin:0;background:var(--zemin);color:var(--ikincil);padding:0 16px;
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  main{max-width:640px;margin:0 auto;padding:72px 0}
  h1{color:var(--metin);font-size:26px;margin:0 0 4px}
  p.alt{color:var(--soluk);margin:0 0 40px}
  h2{color:var(--metin);font-size:17px;margin:32px 0 8px;padding-top:24px;border-top:1px solid var(--cizgi)}
  a{color:var(--vurgu)}
  ul{padding-left:20px;margin:8px 0}li{margin:6px 0}
</style>
</head>
<body><main>
  <h1>Vera</h1>
  <p class="alt">Mobile apps</p>
  <h2>Scroll to Quran</h2>
  <p>A vertical, full-screen Quran reading feed for Android.</p>
  <ul><li><a href="./scroll-to-quran/privacy.html">Privacy Policy · Gizlilik Politikası</a></li></ul>
  <h2>Vera Sudoku</h2>
  <p>A Sudoku game for Android with Easy, Medium, Hard and Master levels.</p>
  <ul><li><a href="./vera-sudoku/privacy.html">Privacy Policy · Gizlilik Politikası</a></li></ul>
</main></body>
</html>
